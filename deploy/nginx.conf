# ── shahrkavi.ir ── Landing page (static files) ────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name shahrkavi.ir www.shahrkavi.ir;

    root /opt/shahrkavi/front-page;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── data.shahrkavi.ir ── Data explorer + API ───────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name data.shahrkavi.ir;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }
}

# ── doc.shahrkavi.ir ── Documentation (rewrites to /docs/) ────────────
server {
    listen 80;
    listen [::]:80;
    server_name doc.shahrkavi.ir;

    client_max_body_size 25m;

    location / {
        rewrite ^/(.*) /docs/$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
