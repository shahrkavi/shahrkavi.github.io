services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - shahrkavi-cache:/app/fastapi/cache
      - shahrkavi-downloads:/app/fastapi/downloads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  shahrkavi-cache:
  shahrkavi-downloads:
